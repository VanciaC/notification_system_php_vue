type User {
    id: ID!
    name: String!
    email: String!
    email_verified_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!
}

type Notification {
    id: ID!
    user: User! @belongsTo
    title: String!
    message: String!
    read: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
}
