type Mutation {
    createNotification(
        user_id: ID!
        title: String!
        message: String!
    ): Notification! @field(resolver: "App\\GraphQL\\Resolvers\\Mutations\\CreateNotification")

    markAsRead(id: ID!): Notification! @field(resolver: "App\\GraphQL\\Resolvers\\Mutations\\MarkNotificationAsRead")
}
